name: Build

# Runs on demand rather than on every push — a README tweak shouldn't kick off
# a 20-minute Windows job.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish the installers under"
        required: true
        default: "v1.0.0"
  release:
    types: [published]

# A newer run supersedes an in-flight one instead of both burning minutes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          # Universal so one download covers both Apple Silicon and Intel.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # tauri-action 打包用的是 tauri.conf.json 里的版本号,tag 只是发布名。
      # 两边对不上的话,发布页写着 v1.0.4、用户装完却显示 1.0.3,而且不会有
      # 任何报错。在这儿卡死,免得又靠人记。
      - name: Verify tag matches the packaged version
        shell: bash
        run: |
          TAG="${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}"
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "tag: $TAG / 包里: $VERSION"
          [ "$TAG" = "v$VERSION" ] || {
            echo "::error::tag 是 $TAG,但 tauri.conf.json 里是 $VERSION。发版前要一起改 package.json、src-tauri/tauri.conf.json、src-tauri/Cargo.toml。"
            exit 1
          }

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.platform }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.platform }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # isideload pulls in OpenSSL, which needs perl+make to build on Windows.
      - name: Install Perl and Make
        if: matrix.platform == 'windows-latest'
        run: choco install strawberryperl make --no-progress

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      # Installers are attached to a Release rather than uploaded as build
      # artifacts: artifacts share a small pooled storage quota (and uploads
      # hard-fail once it is full), while a Release also gives the website a
      # stable download URL.
      - name: Build and publish to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          releaseName: 西瓜IPA安装助手 ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          releaseBody: "Windows 与 macOS 安装包见下方 Assets。"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          # The updater is stripped from this fork, so never emit updater artifacts.
          includeUpdaterJson: false
          assetNamePattern: "XiguaIPAHelper-[platform]-[arch][ext]"
