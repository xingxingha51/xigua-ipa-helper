name: Build

# Windows only: macOS builds locally in ~2 minutes on the maintainer's machine,
# so paying CI minutes for it isn't worth it.
# Not run on every push — a README tweak shouldn't burn a 20-minute Windows job.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish the installers under"
        required: true
        default: "v1.0.0"
  release:
    types: [published]

# A newer run supersedes an in-flight one instead of both burning minutes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # isideload pulls in OpenSSL, which needs perl+make to build on Windows.
      - name: Install Perl and Make
        run: choco install strawberryperl make --no-progress

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      # Installers are attached to a Release rather than uploaded as build
      # artifacts: artifacts share a small pooled storage quota (and uploads
      # hard-fail once it is full), while a Release also gives the website a
      # stable download URL.
      - name: Build and publish to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          releaseName: 西瓜IPA安装助手 ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          releaseBody: "Windows 安装包见下方 Assets。"
          releaseDraft: false
          prerelease: false
          # The updater is stripped from this fork, so never emit updater artifacts.
          includeUpdaterJson: false
          assetNamePattern: "XiguaIPAHelper-[platform]-[arch][ext]"
