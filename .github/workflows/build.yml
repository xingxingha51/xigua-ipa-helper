name: Build

# Windows only: macOS builds locally in ~2 minutes on the maintainer's machine,
# so paying CI minutes (and artifact storage) for it isn't worth it.
# Not run on every push — a README tweak shouldn't burn a 20-minute Windows job.
on:
  workflow_dispatch:
  release:
    types: [published]

# A newer run supersedes an in-flight one instead of both burning minutes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # isideload pulls in OpenSSL, which needs perl+make to build on Windows.
      - name: Install Perl and Make
        run: choco install strawberryperl make --no-progress

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The updater is stripped from this fork, so never emit updater artifacts.
          includeUpdaterJson: false
          releaseId: ${{ github.event_name == 'release' && github.event.release.id || '' }}
          assetNamePattern: "XiguaIPAHelper-[platform]-[arch][ext]"

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: windows
          # Short retention: these are picked up and published within a day or
          # two, and the account's Actions storage quota is small.
          retention-days: 5
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
